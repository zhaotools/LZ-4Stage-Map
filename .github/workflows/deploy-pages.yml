name: Deploy public LZ-4Stage map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://zcvazhbmkalmfgedfpaz.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jhykhNKqSydQN2iUDI9z_Q_p98Fafsv
      VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAEkJSSJBMDInU2Cg
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:verify
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
