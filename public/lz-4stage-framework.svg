<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">四阶段分析：低位整理、上升趋势、高位整理、下降趋势</title>
  <desc id="description">四个阶段并列展示，分别以春、夏、秋、冬辅助记忆；阶段之间没有固定的转换顺序。</desc>
  <rect width="1536" height="1024" fill="#f5f7fb"/>
  <rect x="64" y="66" width="10" height="124" rx="5" fill="#3f7fd2"/>
  <text x="98" y="123" fill="#14284c" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="70" font-weight="700">四阶段分析</text>
  <text x="101" y="180" fill="#667894" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32">用四种市场结构描述当下，不预设下一步方向</text>
  <rect x="64" y="258" width="690" height="278" rx="30" fill="#ffffff" stroke="#dce7f7" stroke-width="3"/>
  <rect x="64" y="258" width="12" height="278" rx="6" fill="#3f7fd2"/>
  <circle cx="210" cy="397" r="88" fill="#e9f1fb"/>
  <text x="210" y="420" fill="#3f7fd2" font-family="Arial, sans-serif" font-size="66" font-weight="700" text-anchor="middle">S1</text>
  <text x="326" y="394" fill="#172b4d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="62" font-weight="700">低位整理</text>
  <text x="328" y="466" fill="#3f7fd2" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="39">春季</text>
  <rect x="782" y="258" width="690" height="278" rx="30" fill="#ffffff" stroke="#dcefe3" stroke-width="3"/>
  <rect x="782" y="258" width="12" height="278" rx="6" fill="#329b57"/>
  <circle cx="928" cy="397" r="88" fill="#e7f5ec"/>
  <text x="928" y="420" fill="#329b57" font-family="Arial, sans-serif" font-size="66" font-weight="700" text-anchor="middle">S2</text>
  <text x="1044" y="394" fill="#172b4d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="62" font-weight="700">上升趋势</text>
  <text x="1046" y="466" fill="#329b57" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="39">夏季</text>
  <rect x="64" y="564" width="690" height="278" rx="30" fill="#ffffff" stroke="#f5e5d4" stroke-width="3"/>
  <rect x="64" y="564" width="12" height="278" rx="6" fill="#d68428"/>
  <circle cx="210" cy="703" r="88" fill="#fcf0e1"/>
  <text x="210" y="726" fill="#d68428" font-family="Arial, sans-serif" font-size="66" font-weight="700" text-anchor="middle">S3</text>
  <text x="326" y="700" fill="#172b4d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="62" font-weight="700">高位整理</text>
  <text x="328" y="772" fill="#d68428" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="39">秋季</text>
  <rect x="782" y="564" width="690" height="278" rx="30" fill="#ffffff" stroke="#f4dce0" stroke-width="3"/>
  <rect x="782" y="564" width="12" height="278" rx="6" fill="#d0444e"/>
  <circle cx="928" cy="703" r="88" fill="#fae9eb"/>
  <text x="928" y="726" fill="#d0444e" font-family="Arial, sans-serif" font-size="66" font-weight="700" text-anchor="middle">S4</text>
  <text x="1044" y="700" fill="#172b4d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="62" font-weight="700">下降趋势</text>
  <text x="1046" y="772" fill="#d0444e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="39">冬季</text>
  <rect x="64" y="896" width="1408" height="76" rx="20" fill="#eaf0f8"/>
  <text x="768" y="946" fill="#405778" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle">阶段可能反复切换；四季只是理解阶段的比喻，不代表固定顺序。</text>
</svg>
